ey scale, stars · light"], ["GlassQuestionnaireStep3", "Questionnaire 3 of 3 · short text · light"], ["GlassQuestionnaireReview", "QuestionnaireReview · check all answers, edit a section, then send · light"], ["GlassQuestionnaireSent", "QuestionnaireSent · answers sent to the coach · light"], ["GlassTodayPhotoRequestBanner", "TodayPhotoRequestBanner · every-day request on Today · light"], ["GlassPhotoRequest", "PhotoRequest · every day: who asks, how long, reminder · Start or Not now · light"], ["GlassPhotoRequestDecline", "PhotoRequestDecline · Not now → optional reason (both types) · light"], ["GlassPhotoRequestDaily", "PhotoRequestDaily · day 3 of 7, one missed day, nothing yet today · light"], ["GlassPhotoRequestDailyAdd", "PhotoRequestDailyAdd · today's photos, a note per photo, send · light"], ["GlassPhotoRequestDailySent", "PhotoRequestDailySent · today's photos sent · light"], ["GlassPhotoRequestDailyDone", "PhotoRequestDailyDone · today sent, notes under each photo, add more · light"], ["GlassTodayPhotoRequestOnceBanner", "TodayPhotoRequestOnceBanner · one-time request on Today · light"], ["GlassPhotoRequestOnceIntro", "PhotoRequestOnceIntro · once: who asks, until when · Add photos or Not now · light"], ["GlassPhotoRequestOnce", "PhotoRequestOnce · all photos at once, a note per photo, send · light"], ["GlassPhotoRequestOnceSent", "PhotoRequestOnceSent · photos sent, request done · light"], ["GlassPhotoRequestClosed", "PhotoRequestClosed · cancelled, ended or declined request opened from a notification (both types) · light"], ["GlassTodayNoPlanPhotoOnce", "TodayNoPlan · one-time photo request still to send · Add opens the request · light (full scroll)"], ["GlassTodayNoPlanPhotoDaily", "TodayNoPlan · every-day request, nothing yet today · Add opens the day view · light (full scroll)"], ["GlassTodayNoPlanPhotoOnceSent", "TodayNoPlan · one-time photos sent · row ticked like Questionnaire sent · light (full scroll)"], ["GlassTodayNoPlanPhotoDailySent", "TodayN   function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }
  function target(el){

    var k = key(el), m;
    if (Object.prototype.hasOwnProperty.call(FLOW, k)) return FLOW[k];
    for (m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : false) return FLOW[m]; }

      board.dataset.w = board.offsetWidth; board.dataset.h = board.offsetHeight;

        document.body.classList.add('fu-device'); if (THEME === 'dark') document.body.classList.add('fu-dark');
