cale, stars · light"], ["GlassQuestionnaireStep3", "Questionnaire 3 of 3 · short text · light"], ["GlassQuestionnaireReview", "QuestionnaireReview · check all answers, edit a section, then send · light"], ["GlassQuestionnaireSent", "QuestionnaireSent · answers sent to the coach · light"], ["GlassTodayPhotoRequestBanner", "TodayPhotoRequestBanner · every-day request on Today · light"], ["GlassPhotoRequest", "PhotoRequest · every day: coach in the header, Start or Not now · light"], ["GlassPhotoRequestDecline", "PhotoRequestDecline · Not now → optional reason, X closes (both types) · light"], ["GlassPhotoRequestDaily", "PhotoRequestDaily · today, nothing yet: note, Today’s photos, Add photos · light"], ["GlassPhotoRequestDailyPast", "PhotoRequestDailyPast · a past day (swipe or tap the strip): photos with notes · light"], ["GlassPhotoRequestDailyNew", "PhotoRequestDailyNew · new photos on top, the earlier send below, Send · light"], ["GlassPhotoRequestDailyDone", "PhotoRequestDailyDone · today sent twice, grouped by send time, Add more photos · light"], ["GlassPhotoRequestDailySent", "PhotoRequestDailySent · today's photos sent · light"], ["GlassTodayPhotoRequestOnceBanner", "TodayPhotoRequestOnceBanner · one-time request on Today · light"], ["GlassPhotoRequestOnceIntro", "PhotoRequestOnceIntro · once: coach in the header, no deadline · light"], ["GlassPhotoRequestOnce", "PhotoRequestOnce · all photos at once, a note per photo, Send · light"], ["GlassPhotoRequestOnceSent", "PhotoRequestOnceSent · photos sent, request done · light"], ["GlassPhotoRequestClosed", "PhotoRequestClosed · cancelled, ended or declined request opened from a notification (both types) · light"], ["GlassTodayNoPlanPhotoOnce", "TodayNoPlan · one-time photo request still to send · Add opens the request · light (full scroll)"], ["GlassTodayNoPlanPhotoDaily", "TodayNoPlan · every-day request, nothing yet today · Add opens the day view · light (full scroll)"], ["GlassTodayNoPlanPhotoOnceSent", "TodayNoPlan · one-time photos sent · row ticked like Questionnaire sent · light (full scroll)"], ["GlassTodayNoPlanPhotoDailySent", "TodayNoPlan · every-day request, today sent · View opens the day view · light (full scroll)"], ["GlassTodayColourCurrent", "Today colour · 0 · current (unchanged copy) · light"], ["GlassTodayColourWash", "Today colour · A · soft module-colour wash, stronger header band · light"], ["GlassTodayColourBorder", "Today colour · B · module-colour border and glow · light"], ["GlassTodayColourProgress", "Today colour · C · colour follows progress: thicker bars, eaten rows tinted · light"], ["GlassTodayColourBackground", "Today colour · D · warm tinted screen, white cards · light"], ["GlassTodayColourHeader", "Today colour · E · module-colour header band only, white card body · light"]], DEVICE = true;
  function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }

    for (m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : false) return FLOW[m]; }
    return null;
  }
  function go(page, theme){ location.href = page + '-' + (theme || THEME) + '.html'; }
  function fit(){
    // Boards are fixed-size frames. Web: zoom to the window width, page in the board's colour.
    // Phone: centre the frame, zoomed to fit the window, on a neutral backdrop.
    var board = document.body.firstElementChild;
    if (!board || board.id === 'fu-bar') return;
    if (!board.dataset.w){
      board.dataset.w = board.offsetWidth; board.dataset.h = board.offsetHeight;
      if (DEVICE){
        document.body.classList.add('fu-device'); if (THEME === 'dark') document.body.classList.add('fu-dark');

      } else {
        document.body.style.background = getComputedStyle(board).backgroundColor;
      }
    }
    var root = document.documentElement;
    board.style.zoom = DEVICE ? Math.min((root.clientHeight - 64) / board.dataset.h, (root.clientWidth - 64) / board.dataset.w)

  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', function(){
    fit();
