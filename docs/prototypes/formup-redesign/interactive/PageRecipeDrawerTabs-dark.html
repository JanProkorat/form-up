<script>
(function(){
  var FLOW = {"Clients": "PageClients", "Inbox": "PageInbox", "Recipes": "PageRecipes", "Ingredients": "PageIngredients", "Plan templates": "PageTemplates", "Forms": "PageForms", "Automations": "PageAutomations", "Packages": "PagePackages", "Log out": "PageHome", "Martin Král": "PageAccountMenu"}, PAGE = "PageRecipeDrawerTabs", THEME = "dark", PAGES = [["PageHome", "Home · full page"], ["PageHomeSignIn", "Home · Sign in dialog"], ["PageRegister", "Register · 1 Account"], ["PageRegisterEmailSteps", "Register · check email, change email, email verified"], ["PageRegisterPlan", "Register · Choose plan"], ["PageRegisterClient", "Register · Client · 1 Account"], ["PageRegisterClientCheckEmail", "Register · Client · 2 Check email"], ["PageRegisterGetApp", "Register · Client · 3 Get the app"], ["PageClients", "Clients"], ["PageClientDetail", "ClientDetail"], ["PageClientDetailTrainer", "ClientDetail · Trainer only"], ["PageClientDetailNutritionist", "ClientDetail · Nutritionist only"], ["PageClientNutrition", "ClientDetail · Nutrition tab"], ["PageClientNutritionEmpty", "ClientDetail · Nutrition, no plan yet"], ["PageClientPlanEditor", "Client plan · Library › Templates"], ["PageClientPlanDay", "Client plan · Day view"], ["PageClientPlanDayAddMeal", "Client plan · Day · Add meal drawer"], ["PageClientPlanStartOver", "Client plan · replace with template?"], ["PageClientPlanInfo", "Client plan · Plan info tab"], ["PageClientPlanBlank", "Client plan · blank"], ["PageClientPlanClosed", "Client plan · panel closed"], ["PageClientInviteDrawer", "Clients · Invite client drawer"], ["ClientHeaderOptions", "ClientDetail · Header options"], ["PageClientPhotos", "ClientDetail · Photos tab"], ["PageClientPhotosViewer", "ClientDetail · Photos · photo viewer"], ["PageClientPhotosCompare", "ClientDetail · Photos · compare"], ["PageClientPhotosRequest", "ClientDetail · Photos · Request photos drawer"], ["PageClientsPending", "Clients — Pending"], ["PageClientsRestricted", "Clients · outside the plan"], ["PageClientDetailRestricted", "ClientDetail · outside the plan"], ["PageInbox", "Inbox"], ["PageInboxRequest", "Inbox — new client invite"], ["PageNotificationsPopover", "Notifications (popover)"], ["PageInboxInvite", "Inbox — coach invite"], ["PageInboxInviteStates", "Coach invite card states"], ["PageInviteReview", "Invite review — package chosen, history shared"], ["PageInviteNoPackage", "Invite review — no package, coach proposes one"], ["PageInviteProposalSent", "Inbox — package proposal sent"], ["PageInviteDiscount", "Invite review — discount picker open"], ["PageInviteFormMenu", "Invite review — form menu open"], ["PageRecipes", "Recipes"], ["PageRecipesTable", "Recipes · table view"], ["PageRecipeDrawerTabs", "Recipe drawer · Details, Ingredients, Preparation, Pictures tabs"], ["PageIngredients", "Ingredients"], ["PageIngredientDrawer", "IngredientDrawer"], ["PageTemplates", "Templates"], ["PageTemplateNew", "TemplateNew"], ["PageTemplateEditorEmpty", "TemplateEditor · empty (no meals chosen)"], ["PageTemplateEditor", "TemplateEditor"], ["PageTemplateMeal", "TemplateMeal"], ["PageTemplateNutrition", "TemplateNutrition"], ["PageTemplateDay", "TemplateDay"], ["PageTemplateDayAddMeal", "TemplateDay · Add meal drawer"], ["PageTemplateCardDrop", "TemplateCardDrop · replace or add"], ["PageTemplateLibraryInfo", "TemplateLibraryInfo"], ["PageTemplateInfo", "TemplateInfo · side panel tab"], ["PageTemplateLibraryFilters", "TemplateLibraryFilters · recipes, ingredients"], ["PageTemplateRowRemove", "TemplateRowRemove · hover ✕ + confirm"], ["PageForms", "Forms"], ["PageFormOnboarding", "Form editor · Client onboarding"], ["PageFormCheckIn", "Form editor · Weekly check-in"], ["PageProfile", "Coach profile"], ["PageSettings", "Settings"], ["PageAccountMenu", "Account menu (popover)"], ["PageDialogs", "Dialogs · settings, roles, bank, paywall"], ["PageResetPasswordFlow", "Reset password · request, check email, new password, done, expired"], ["PageEmailOff", "Email turn-off · turned off, turned back on, link doesn’t work"], ["PagePackages", "Business · Packages"], ["PagePackageDrawer", "Business · New package"], ["PageDiscounts", "Business · Discounts"], ["PageDiscountDrawer", "Business · New discount"], ["PageAutomations", "Automations · Rules"], ["PageAutomationRuleDrawer", "Automations · Edit rule · schedule"], ["PageAutomationRuleEventDrawer", "Automations · Edit rule · event"], ["PageClientPayment", "ClientDetail · Payment tab"], ["PageClientPaymentRequest", "ClientDetail · Request payment"], ["PageClientAutomations", "ClientDetail · Automations tab"], ["PageSettingsPayments", "Settings · Payments"], ["PagePlanPicker", "Coach plan · Choose your plan"], ["PageSettingsPlan", "Settings · Plan and billing"], ["PageSettingsPlanPastDue", "Settings · Plan and billing · payment failed"], ["PagePlanChangedNotice", "Settings · Plan changed by Form Up"], ["PagePlanEndedNotice", "Clients · Plan ended by Form Up (toast)"], ["PagePlanNotifications", "Notifications · Plan changes"], ["PagePlanDecision", "Coach plan · Plan changed, decision needed"], ["PagePaywallFeature", "Paywall · Feature not on plan"], ["PageLapseKeepClients", "Plan ended · Pick 2 clients to keep"], ["PageAdminPlans", "Admin · Plans"], ["PageAdminPromotions", "Admin · Promotions"], ["PageAdminPromotionDrawer", "Admin · New promotion"], ["PageAdminPlanDrawer", "Admin · Edit plan"], ["PageAdminCoaches", "Admin · Coaches"], ["PageAdminCoachProfile", "Admin · Coach profile"], ["PageAdminCoachDialogs", "Admin · Coach action dialogs"], ["PageClientActivityOfflineSync", "ClientDetail · Recent activity with offline-sync conflicts"], ["PageNotificationsOfflineSync", "Notifications (popover) · offline-sync conflict"], ["PageClientPlanEditorOfflineSync", "Client plan · Week · offline-sync conflict popover"], ["PageClientPlanDayOfflineSync", "Client plan · Day · offline-sync comparison"], ["PageClientPlanWeekLocked", "Client plan · Week · eaten, partly eaten and missed meals locked"], ["PageClientPlanDayLocked", "Client plan · Day · past day read-only, per-item eaten ticks"], ["PageClientPlanWeekLockedPopover", "Client plan · Week · locked meal popover (Tue lunch, partly eaten)"], ["PageClientPlanWeekLockedOffline", "Client plan · Week · offline conflict under the lock rule (Eva’s meal kept, your change not applied)"], ["PageClientPlanDayLockedOffline", "Client plan · Day · offline conflicts locked as eaten, Mark reviewed only dismisses"], ["PageClientForms", "ClientDetail · Forms tab"], ["PageClientFormsEmpty", "ClientDetail · Forms tab, nothing answered yet"], ["PageClientPlanForms", "Client plan · Forms tab"], ["PageClientPlanFormsPopover", "Client plan · Forms tab · answers popover"], ["PageAutomationRuleDrawerCheckIn", "Automations · Weekly check-in rule"], ["PageClientFormsCheckIn", "ClientDetail · Forms tab · Weekly check-in"]], DEVICE = false;
  function key(el){ return (el.getAttribute('aria-label') || el.getAttribute('title') || el.textContent || '').replace(/\s+/g,' ').trim(); }
  function target(el){
    // Exact keys win over ^prefix and *contains keys; a null target marks a label as not clickable.
    var k = key(el), m;
    if (Object.prototype.hasOwnProperty.call(FLOW, k)) return FLOW[k];
    for (m in FLOW){ var c = m[0], v = m.slice(1); if (c === '^' ? k.indexOf(v) === 0 : c === '*' ? k.indexOf(v) >= 0 : false) return FLOW[m]; }
    return null;
  }
  function go(page, theme){ location.href = page + '-' + (theme || THEME) + '.html'; }
  function fit(){
    // Boards are fixed-size frames. Web: zoom to the window width, page in the board's colour.
    // Phone: centre the frame, zoomed to fit the window, on a neutral backdrop.
    var board = document.body.firstElementChild;
    if (!board || board.id === 'fu-bar') return;
    if (!board.dataset.w){
      board.dataset.w = board.offsetWidth; board.dataset.h = board.offsetHeight;
      if (DEVICE){
        document.body.classList.add('fu-device'); if (THEME === 'dark') document.body.classList.add('fu-dark');
        board.style.borderRadius = '48px'; board.style.boxShadow = '0 30px 80px rgba(0,0,0,.28), 0 0 0 10px #0B0B0C';
      } else {
        document.body.style.background = getComputedStyle(board).backgroundColor;
      }
    }
    var root = document.documentElement;
    board.style.zoom = DEVICE ? Math.min((root.clientHeight - 64) / board.dataset.h, (root.clientWidth - 64) / board.dataset.w)
                              : root.clientWidth / board.dataset.w;
  }
  window.addEventListener('resize', fit);
  document.addEventListener('DOMContentLoaded', function(){
    fit();
    document.querySelectorAll('a,button,tr,[role=tab],[role=radio]').forEach(function(el){ if (target(el)) el.classList.add('fu-hot'); });
    var bar = document.createElement('div'); bar.id = 'fu-bar';
    var opts = PAGES.map(function(p){ return '<option value="'+p[0]+'"'+(p[0]===PAGE?' selected':'')+'>'+p[1]+'</option>'; }).join('');
    bar.innerHTML = '<select aria-label="Jump to screen">'+opts+'</select>'
      + '<button data-t="light" class="'+(THEME==='light'?'on':'')+'">Light</button><button data-t="dark" class="'+(THEME==='dark'?'on':'')+'">Dark</button>'
      + '<button data-h="1" title="Show clickable areas (H)">Hotspots</button><a href="../index.html">All screens</a>';
    document.body.appendChild(bar);
    bar.querySelector('select').addEventListener('change', function(e){ go(e.target.value); });
    bar.querySelectorAll('[data-t]').forEach(function(b){ b.addEventListener('click', function(){ go(PAGE, b.getAttribute('data-t')); }); });
    bar.querySelector('[data-h]').addEventListener('click', function(){ document.body.classList.toggle('fu-show'); });
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('fu-show'); });
  document.addEventListener('click', function(e){
    if (e.target.closest && e.target.closest('#fu-bar')) return;
    var el = e.target.closest ? e.target.closest('a,button,tr,[role=tab],[role=radio]') : null;
    if (!el) return;
    e.preventDefault();
    var t = target(el);
    if (t) go(t); else if (el.tagName !== 'TR' && !document.body.classList.contains('fu-show')) { document.body.classList.add('fu-show'); setTimeout(function(){ document.body.classList.remove('fu-show'); }, 600); }
  }, true);
})();
</script>
